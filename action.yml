name: vibecheck-scan
description: "Unified static analysis with intelligent issue creation for AI-driven development"
author: "WolffM"

branding:
  icon: "shield"
  color: "purple"

inputs:
  mode:
    description: "Run mode: analyze (static analysis + issues) or audit (vibeCheck Audit living report)"
    required: false
    default: "analyze"
  cadence:
    description: "Analysis cadence: daily, weekly, or monthly"
    required: false
    default: "weekly"
  severity_threshold:
    description: "Minimum severity for issues: critical, high, medium, low, info"
    required: false
    default: "medium"
  confidence_threshold:
    description: "Minimum confidence for issues: high, medium, low"
    required: false
    default: low
  skip_issues:
    description: "Skip GitHub issue creation/updates"
    required: false
    default: "false"
  config_path:
    description: "Path to vibecheck.yml config file"
    required: false
    default: "vibecheck.yml"
  github_token:
    description: "GitHub token for issue management"
    required: true
  create_config_pr:
    description: "Create a PR with generated config files (.trunk/, etc.) if they don't exist. Requires contents:write and pull-requests:write permissions."
    required: false
    default: "false"
  autofix_prs:
    description: "Create PRs for findings with safe autofixes (ESLint formatting, Ruff style). Requires contents:write and pull-requests:write permissions."
    required: false
    default: "false"
  vibecheck_github_package_token:
    description: "GitHub token for accessing private packages from GitHub Package Registry. Use this if your repository has private @org/package dependencies. Typically set to secrets.GITHUB_TOKEN or a custom PAT with packages:read scope."
    required: false
    default: ""

outputs:
  total_findings:
    description: Total number of findings
    value: ${{ steps.analyze.outputs.total_findings }}
  issues_created:
    description: "Number of issues created"
    value: ${{ steps.analyze.outputs.issues_created }}
  issues_updated:
    description: "Number of issues updated"
    value: ${{ steps.analyze.outputs.issues_updated }}
  issues_closed:
    description: "Number of issues closed"
    value: ${{ steps.analyze.outputs.issues_closed }}
  sarif_path:
    description: "Path to generated SARIF file"
    value: ${{ steps.analyze.outputs.sarif_path }}
  llm_json_path:
    description: "Path to generated LLM JSON file"
    value: ${{ steps.analyze.outputs.llm_json_path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    # NOT pnpm/action-setup: its install dir is per-$HOME, and self-hosted
    # hosts running several runners under one user race on it when jobs
    # start together (the daily cron does exactly that) — observed as
    # ENOENT/ENOTEMPTY store corruption across four repos at once. A
    # job-isolated prefix under RUNNER_TEMP cannot race; npm's own cache
    # is content-addressed and concurrency-safe.
    - name: Setup pnpm (job-isolated)
      shell: bash
      run: |
        PNPM_PREFIX="$RUNNER_TEMP/pnpm-home"
        mkdir -p "$PNPM_PREFIX"
        npm install -g --prefix "$PNPM_PREFIX" pnpm@11
        echo "$PNPM_PREFIX/bin" >> $GITHUB_PATH

    - name: Install vibeCheck dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        pnpm install --frozen-lockfile
        # Put OUR bin dir on PATH. Every later step runs with cwd set to the
        # caller's workspace, so a bare `tsx` resolves against THEIR
        # node_modules, not ours — and tsx is our devDependency, not theirs.
        # It only ever appeared to work on repos that happened to carry a
        # hoisted tsx of their own.
        echo "${{ github.action_path }}/node_modules/.bin" >> $GITHUB_PATH

    # ------------------------------------------------------------------
    # mode: audit — activity gate, pinned scc, audit run, publish.
    # The gate is a CI cost guard only; local runs always execute.
    # ------------------------------------------------------------------
    - name: Audit activity gate
      if: inputs.mode == 'audit'
      id: audit-gate
      shell: bash
      run: |
        # Cron cost guard only — an explicit dispatch is its own
        # justification, exactly like a local run (design §7).
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "active=true" >> $GITHUB_OUTPUT
          echo "Explicit ${{ github.event_name }} run — gate bypassed."
          exit 0
        fi
        cd ${{ github.action_path }}
        OUTPUT=$(node bin/cli.js gate --root "${{ github.workspace }}")
        echo "$OUTPUT"
        echo "$OUTPUT" | grep "^active=" >> $GITHUB_OUTPUT

    - name: Install scc (audit)
      if: inputs.mode == 'audit' && steps.audit-gate.outputs.active == 'true'
      shell: bash
      run: |
        SCC_VERSION="3.7.0"
        case "$(uname -m)" in
          aarch64|arm64) SCC_ARCH="arm64" ;;
          *) SCC_ARCH="x86_64" ;;
        esac
        mkdir -p "$HOME/.local/bin"
        if curl -sSfL "https://github.com/boyter/scc/releases/download/v${SCC_VERSION}/scc_Linux_${SCC_ARCH}.tar.gz" | tar -xz -C "$HOME/.local/bin" scc; then
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "scc ${SCC_VERSION} installed"
        else
          echo "::warning::scc install failed; the size lane will be skipped with disclosure"
        fi
        # Python dead-code coverage (soft-fail; lane discloses absence).
        # python3 -m pip, never bare pip: a PATH'd pip from another
        # interpreter installs somewhere python3 can't import from — the
        # install "succeeds" and the lane still degrades. PEP 668 hosts
        # need --break-system-packages for a user install.
        # -print -quit, never `| head`: under pipefail, head's early exit
        # kills find with SIGPIPE and the whole install block silently
        # skips — the root cause of vulture's on-again-off-again absence.
        if [ -n "$(find "${{ github.workspace }}" -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" -print -quit)" ]; then
          # Debian 13 ships python3 with NO pip module (hadoku_site
          # handoff), so pip cannot be the only path. Preference:
          # already available → pipx → python3 -m pip (user, then PEP
          # 668) → ensurepip bootstrap. Each warning names the actual
          # gap so the lane's disclosure is diagnosable from the log.
          if python3 -m vulture --version >/dev/null 2>&1 || command -v vulture >/dev/null 2>&1; then
            echo "vulture already available"
          elif command -v pipx >/dev/null 2>&1 && pipx install --force vulture==2.16 >/dev/null 2>&1; then
            echo "vulture installed via pipx"
          elif python3 -m pip --version >/dev/null 2>&1; then
            python3 -m pip install --quiet --user vulture==2.16 \
              || python3 -m pip install --quiet --user --break-system-packages vulture==2.16 \
              || echo "::warning::vulture pip install failed; Python dead code will be skipped with disclosure"
          elif python3 -m ensurepip --user >/dev/null 2>&1; then
            python3 -m pip install --quiet --user --break-system-packages vulture==2.16 \
              || echo "::warning::vulture install failed after ensurepip bootstrap"
          else
            echo "::warning::runner has no pip module and no pipx for $(command -v python3) — Python dead code will be skipped with disclosure (provision pipx or python3-pip on this runner)"
          fi
          # Verify with what the audit will actually use (PATH or -m).
          { command -v vulture >/dev/null 2>&1 || python3 -m vulture --version >/dev/null 2>&1; } \
            && echo "vulture OK" \
            || echo "::warning::vulture still unavailable to $(command -v python3) after install attempts"
        fi

    - name: Install target JS dependencies (audit)
      if: inputs.mode == 'audit' && steps.audit-gate.outputs.active == 'true'
      shell: bash
      continue-on-error: true
      run: |
        # knip needs resolvable plugins and type-coverage needs the
        # repo's tsconfig `extends` chain — both fail against a bare
        # checkout, degrading two lanes with disclosure. Best-effort
        # install at every first-level JS project root; the audit
        # discloses whatever still isn't resolvable.
        cd "${{ github.workspace }}"
        for dir in . */; do
          dir="${dir%/}"
          [ -f "$dir/package.json" ] || continue
          echo "Installing JS dependencies in $dir"
          (
            cd "$dir"
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile || pnpm install || true
            elif [ -f yarn.lock ]; then
              yarn install --frozen-lockfile || yarn install || true
            elif [ -f package-lock.json ]; then
              npm ci || npm install || true
            else
              npm install || true
            fi
          )
        done
        # Non-frozen fallbacks may rewrite lockfiles; restore tracked
        # files so the audit's dirty-tree detection stays truthful.
        git checkout -- . 2>/dev/null || true

    - name: Run audit
      if: inputs.mode == 'audit' && steps.audit-gate.outputs.active == 'true'
      shell: bash
      run: |
        cd ${{ github.action_path }}
        node bin/cli.js audit --root "${{ github.workspace }}"

    - name: Publish audit
      if: inputs.mode == 'audit' && steps.audit-gate.outputs.active == 'true'
      id: audit-publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        cd ${{ github.action_path }}
        node --import tsx src/audit/publish/github-cli.ts --root "${{ github.workspace }}"

    - name: Upload audit outputs (report, briefing, machine data)
      if: inputs.mode == 'audit' && steps.audit-gate.outputs.active == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vibecompact-outputs-${{ github.run_id }}
        path: |
          ${{ github.workspace }}/.vibecompact/audit.md
          ${{ github.workspace }}/.vibecompact/out/
          ${{ github.workspace }}/.vibecompact/findings/
        retention-days: 30

    - name: Upload apply-run artifact
      if: inputs.mode == 'audit' && steps.audit-publish.outputs.data_channel == 'artifact'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vibecompact-run-${{ github.run_id }}
        path: ${{ steps.audit-publish.outputs.artifact_path }}

    - name: Detect JS/TS files
      if: inputs.mode != 'audit'
      id: detect-js
      shell: bash
      run: |
        # Check for JS/TS project files
        if [ -f "${{ github.workspace }}/package.json" ]; then
          echo "has_js=true" >> $GITHUB_OUTPUT
          echo "JS/TS project detected (package.json found)"
        elif [ -n "$(find "${{ github.workspace }}" -name "*.ts" -o -name "*.tsx" -o -name "*.jsx" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | head -1)" ]; then
          echo "has_js=true" >> $GITHUB_OUTPUT
          echo "JS/TS source files detected"
        else
          echo "has_js=false" >> $GITHUB_OUTPUT
          echo "No JS/TS files detected"
        fi

    - name: Setup Trunk
      if: steps.detect-js.outputs.has_js == 'true'
      uses: trunk-io/trunk-action/setup@4d5ecc89b2691705fd08c747c78652d2fc806a94 # v1.1.19

    - name: Setup Python
      if: inputs.mode != 'audit'
      # Soft-fail, for the same reason the linter installs below are soft: a
      # host with no 3.11 build available degrades the Python lanes, it does
      # not invalidate the JS/TS scan. Debian 13 claws have no x64 3.11 in the
      # tool cache and the download 404s, so this step is the difference
      # between "Python lanes skipped with disclosure" and a red run that
      # reports nothing at all. Every downstream Python step already guards on
      # `command -v python3`, and the system interpreter remains on PATH.
      continue-on-error: true
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - name: Detect Python files
      if: inputs.mode != 'audit'
      id: detect-python
      shell: bash
      run: |
        # Check for Python project files (more reliable than just .py files)
        if [ -n "$(find "${{ github.workspace }}" \( -name "pyproject.toml" -o -name "setup.py" -o -name "requirements.txt" -o -name "Pipfile" \) 2>/dev/null | head -1)" ]; then
          echo "has_python=true" >> $GITHUB_OUTPUT
          echo "Python project files detected"
        elif [ -n "$(find "${{ github.workspace }}" -name "*.py" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | head -1)" ]; then
          echo "has_python=true" >> $GITHUB_OUTPUT
          echo "Python source files detected"
        else
          echo "has_python=false" >> $GITHUB_OUTPUT
          echo "No Python files detected"
        fi

    - name: Install Opengrep (Security Scanner)
      if: inputs.mode != 'audit'
      shell: bash
      run: |
        # Opengrep (open-source semgrep fork) scans all code, not just Python.
        # Installed as a pinned static binary; no hosted registry involved.
        OPENGREP_VERSION="v1.26.0"
        case "$(uname -m)" in
          aarch64|arm64) OPENGREP_ARCH="aarch64" ;;
          *) OPENGREP_ARCH="x86" ;;
        esac
        mkdir -p "$HOME/.local/bin"
        if curl -fsSL -o "$HOME/.local/bin/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_${OPENGREP_ARCH}"; then
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        else
          echo "::warning::opengrep install failed, security scanning will be skipped"
        fi

        # Community security rules (fork of the pre-relicense semgrep ruleset).
        # git clone refuses an existing directory, and RUNNER_TEMP is only
        # guaranteed fresh on hosted runners.
        rm -rf "$RUNNER_TEMP/opengrep-rules"
        if git clone --depth 1 https://github.com/opengrep/opengrep-rules.git "$RUNNER_TEMP/opengrep-rules"; then
          echo "VIBECHECK_OPENGREP_RULES=$RUNNER_TEMP/opengrep-rules" >> "$GITHUB_ENV"
        else
          echo "::warning::opengrep-rules clone failed, security scanning will be skipped"
        fi

    - name: Install Python Analysis Tools
      if: inputs.mode != 'audit'
      shell: bash
      run: |
        # Install Python-specific tools only if Python files detected
        if [ "${{ steps.detect-python.outputs.has_python }}" == "true" ]; then
          echo "Installing Python analysis tools (ruff, mypy, bandit)..."
          # Soft-fail, like the vulture install: a missing linter degrades its
          # lane with disclosure (the runners already skip on isToolAvailable),
          # whereas a hard failure takes the whole scan down with it.
          # python3 -m pip, never bare pip: a PATH'd pip from another
          # interpreter installs somewhere python3 can't import from — the
          # install "succeeds" and the lane still degrades.
          # setup-python's interpreter is itself externally managed here (the
          # claws resolve it to a uv-provided build), so PEP 668 rejects even a
          # --user install and every path needs a fallback. Preference:
          # uv → pipx → python3 -m pip (user, then PEP 668) → ensurepip.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for tool in ruff mypy bandit; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool already available"
            elif command -v uv >/dev/null 2>&1 && uv tool install --quiet "$tool" >/dev/null 2>&1; then
              echo "$tool installed via uv"
            elif command -v pipx >/dev/null 2>&1 && pipx install --force "$tool" >/dev/null 2>&1; then
              echo "$tool installed via pipx"
            elif python3 -m pip --version >/dev/null 2>&1; then
              python3 -m pip install --quiet --user "$tool" \
                || python3 -m pip install --quiet --user --break-system-packages "$tool" \
                || echo "::warning::$tool pip install failed; its findings will be skipped with disclosure"
            elif python3 -m ensurepip --user >/dev/null 2>&1; then
              python3 -m pip install --quiet --user --break-system-packages "$tool" \
                || echo "::warning::$tool install failed after ensurepip bootstrap"
            else
              echo "::warning::runner has no pip module, uv, or pipx for $(command -v python3) — $tool will be skipped with disclosure (provision uv, pipx, or python3-pip on this runner)"
            fi
          done
          # uv tool install puts shims under ~/.local/bin, which GITHUB_PATH
          # only exports to *later* steps — check there too so the log tells
          # the truth about what this run will actually have.
          for tool in ruff mypy bandit; do
            { command -v "$tool" >/dev/null 2>&1 || [ -x "$HOME/.local/bin/$tool" ]; } \
              && echo "$tool OK" \
              || echo "::warning::$tool still unavailable after install attempts"
          done
        else
          echo "Skipping Python-specific tools (no Python files detected)"
        fi

    - name: Install JS/TS Analysis Tools
      if: inputs.mode != 'audit'
      shell: bash
      run: |
        # Install dependency-cruiser and knip globally for cross-repo analysis
        # These tools work without config files (depcruise uses --no-config, knip auto-detects)
        npm install -g dependency-cruiser knip

    - name: Configure NPM Authentication
      if: inputs.mode != 'audit' && inputs.vibecheck_github_package_token != ''
      shell: bash
      run: |
        # Configure authentication for GitHub Package Registry
        # This allows vibecheck to install private @org/package dependencies
        cd "${{ github.workspace }}"
        echo "Configuring NPM authentication for GitHub Packages..."
        
        # Create .npmrc if it doesn't exist
        if [ ! -f .npmrc ]; then
          touch .npmrc
        fi
        
        # Remove any existing GitHub Package Registry auth token to avoid duplicates
        # GitHub Actions runners use Linux, so we can use sed without backup extension
        sed -i '/^\/\/npm\.pkg\.github\.com\/:_authToken=/d' .npmrc
        
        # Add GitHub Package Registry authentication
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.vibecheck_github_package_token }}" >> .npmrc
        echo "NPM authentication configured for GitHub Packages"

    - name: Install Target Repo JS Dependencies
      if: inputs.mode != 'audit'
      shell: bash
      # Allow workflow to continue even if dependencies fail to install
      # Tools that require dependencies (ESLint, TypeScript) will be gracefully skipped
      continue-on-error: true
      run: |
        # Install target repo's node dependencies for ESLint and TypeScript analysis
        # This is needed for modern ESLint configs that import packages
        # Note: This step continues on error - if dependencies fail to install,
        # tools that require them (ESLint, TypeScript) will be skipped
        cd "${{ github.workspace }}"
        if [ -f "package.json" ]; then
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Installing dependencies with pnpm..."
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f "yarn.lock" ]; then
            echo "Installing dependencies with yarn..."
            yarn install --frozen-lockfile || yarn install
          elif [ -f "package-lock.json" ]; then
            echo "Installing dependencies with npm..."
            npm ci || npm install
          else
            echo "Installing dependencies with npm (no lockfile)..."
            npm install
          fi
        else
          echo "No package.json found, skipping JS dependency installation"
        fi

    - name: Detect Java files
      if: inputs.mode != 'audit'
      id: detect-java
      shell: bash
      run: |
        # Check for Java project files OR Java source files
        if [ -n "$(find "${{ github.workspace }}" -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | head -1)" ]; then
          echo "has_java=true" >> $GITHUB_OUTPUT
          echo "Java project files detected"
        elif [ -n "$(find "${{ github.workspace }}" -name "*.java" -type f 2>/dev/null | head -1)" ]; then
          echo "has_java=true" >> $GITHUB_OUTPUT
          echo "Java source files detected"
        else
          echo "has_java=false" >> $GITHUB_OUTPUT
          echo "No Java files detected"
        fi

    - name: Setup Java (if needed)
      if: steps.detect-java.outputs.has_java == 'true'
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Install PMD (if Java detected)
      if: steps.detect-java.outputs.has_java == 'true'
      shell: bash
      run: |
        echo "Installing PMD..."
        PMD_VERSION="7.0.0"
        # Download to RUNNER_TEMP, never the workspace: a stray archive in
        # the checkout gets scanned by the analysis tools and flips the
        # audit's git-status dirty detection.
        curl -L "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip" -o "$RUNNER_TEMP/pmd.zip"
        unzip -qo "$RUNNER_TEMP/pmd.zip" -d /tmp
        echo "/tmp/pmd-bin-${PMD_VERSION}/bin" >> $GITHUB_PATH

    - name: Install SpotBugs (if Java detected)
      if: steps.detect-java.outputs.has_java == 'true'
      shell: bash
      run: |
        echo "Installing SpotBugs..."
        SPOTBUGS_VERSION="4.8.3"
        curl -L "https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.tgz" -o "$RUNNER_TEMP/spotbugs.tgz"
        tar -xzf "$RUNNER_TEMP/spotbugs.tgz" -C /tmp
        echo "/tmp/spotbugs-${SPOTBUGS_VERSION}/bin" >> $GITHUB_PATH

    - name: Compile Java files for SpotBugs (if Java detected)
      if: steps.detect-java.outputs.has_java == 'true'
      shell: bash
      run: |
        echo "Compiling Java files for SpotBugs analysis..."
        WORKSPACE="${{ github.workspace }}"

        # Try Maven build first
        if [ -f "$WORKSPACE/pom.xml" ]; then
          echo "Found Maven project, running mvn compile..."
          cd "$WORKSPACE" && mvn compile -q -DskipTests 2>/dev/null || echo "Maven compile failed (non-fatal)"
        # Try Gradle build
        elif [ -f "$WORKSPACE/build.gradle" ] || [ -f "$WORKSPACE/build.gradle.kts" ]; then
          echo "Found Gradle project, running gradle compile..."
          cd "$WORKSPACE" && ./gradlew compileJava -q 2>&1 || ./gradlew compileDebugKotlinAndroid -q 2>&1 || ./gradlew :composeApp:compileDebugKotlinAndroid -q 2>&1 || ./gradlew compileKotlin -q 2>&1 || ./gradlew :composeApp:compileKotlin -q 2>&1 || gradle compileJava -q 2>&1 || echo "Gradle compile failed (non-fatal)"
        else
          # Fallback: compile standalone Java files to a target directory
          echo "No build system found, compiling standalone Java files..."
          JAVA_FILES=$(find "$WORKSPACE" -name "*.java" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null)
          if [ -n "$JAVA_FILES" ]; then
            # Find directories containing Java files and compile each
            for dir in $(echo "$JAVA_FILES" | xargs -n1 dirname | sort -u); do
              TARGET_DIR="$dir/target/classes"
              mkdir -p "$TARGET_DIR"
              echo "Compiling Java files in $dir..."
              # Compile all Java files in this directory, ignoring errors
              find "$dir" -maxdepth 1 -name "*.java" -exec javac -d "$TARGET_DIR" {} + 2>/dev/null || echo "Some files failed to compile (non-fatal)"
            done
          fi
        fi

    - name: Detect Kotlin files
      if: inputs.mode != 'audit'
      id: detect-kotlin
      shell: bash
      run: |
        if [ -n "$(find "${{ github.workspace }}" -name "build.gradle.kts" -o -name "settings.gradle.kts" 2>/dev/null | head -1)" ]; then
          echo "has_kotlin=true" >> $GITHUB_OUTPUT
          echo "Kotlin project detected (build.gradle.kts found)"
        elif [ -n "$(find "${{ github.workspace }}" -name "*.kt" -type f -not -path "*/.git/*" 2>/dev/null | head -1)" ]; then
          echo "has_kotlin=true" >> $GITHUB_OUTPUT
          echo "Kotlin source files detected"
        else
          echo "has_kotlin=false" >> $GITHUB_OUTPUT
          echo "No Kotlin files detected"
        fi

    - name: Install detekt CLI (if Kotlin detected)
      if: steps.detect-kotlin.outputs.has_kotlin == 'true'
      shell: bash
      run: |
        echo "Installing detekt CLI..."
        DETEKT_VERSION="1.23.7"
        curl -sSL "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip" -o "$RUNNER_TEMP/detekt.zip"
        unzip -qo "$RUNNER_TEMP/detekt.zip" -d /tmp/detekt
        echo "/tmp/detekt/detekt-cli-${DETEKT_VERSION}/bin" >> $GITHUB_PATH

    - name: Detect Rust files
      if: inputs.mode != 'audit'
      id: detect-rust
      shell: bash
      run: |
        # Check for Rust project files (Cargo.toml) OR .rs files
        if [ -f "${{ github.workspace }}/Cargo.toml" ]; then
          echo "has_rust=true" >> $GITHUB_OUTPUT
          echo "Rust project detected (Cargo.toml found)"
        elif [ -n "$(find "${{ github.workspace }}" -name "*.rs" -type f -not -path "*/target/*" -not -path "*/.cargo/*" 2>/dev/null | head -1)" ]; then
          echo "has_rust=true" >> $GITHUB_OUTPUT
          echo "Rust source files detected"
        else
          echo "has_rust=false" >> $GITHUB_OUTPUT
          echo "No Rust files detected"
        fi

    - name: Setup Rust (if needed)
      if: steps.detect-rust.outputs.has_rust == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy

    - name: Install Rust Analysis Tools
      if: steps.detect-rust.outputs.has_rust == 'true'
      shell: bash
      run: |
        echo "Installing Rust analysis tools (cargo-audit, cargo-deny)..."
        cargo install cargo-audit cargo-deny --locked

    - name: Generate Cargo.lock files (for cargo-audit/deny)
      if: steps.detect-rust.outputs.has_rust == 'true'
      shell: bash
      run: |
        # Find all directories with Cargo.toml and generate Cargo.lock if missing
        find "${{ github.workspace }}" -name "Cargo.toml" -not -path "*/target/*" | while read cargo_toml; do
          dir=$(dirname "$cargo_toml")
          if [ ! -f "$dir/Cargo.lock" ]; then
            echo "Generating Cargo.lock in $dir..."
            (cd "$dir" && cargo generate-lockfile 2>/dev/null) || echo "  Failed to generate lockfile (non-fatal)"
          fi
        done

    - name: Run Analysis
      if: inputs.mode != 'audit'
      id: analyze
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        HAS_JS: ${{ steps.detect-js.outputs.has_js }}
      run: |
        OUTPUT_DIR="${{ github.workspace }}/.vibecheck-output"

        # Run the analysis
        tsx ${{ github.action_path }}/src/core/analyze.ts \
          --root "${{ github.workspace }}" \
          --cadence "${{ inputs.cadence }}" \
          --config "${{ inputs.config_path }}" \
          --output "$OUTPUT_DIR" \
          --severity "${{ inputs.severity_threshold }}" \
          --confidence "${{ inputs.confidence_threshold }}" \
          ${{ inputs.skip_issues == 'true' && '--skip-issues' || '' }}

        # Set outputs
        if [ -f "$OUTPUT_DIR/results.llm.json" ]; then
          echo "total_findings=$(jq '.summary.totalFindings // 0' $OUTPUT_DIR/results.llm.json)" >> $GITHUB_OUTPUT
          echo "issues_created=$(jq '.summary.issuesCreated // 0' $OUTPUT_DIR/results.llm.json)" >> $GITHUB_OUTPUT
          echo "issues_updated=$(jq '.summary.issuesUpdated // 0' $OUTPUT_DIR/results.llm.json)" >> $GITHUB_OUTPUT
          echo "issues_closed=$(jq '.summary.issuesClosed // 0' $OUTPUT_DIR/results.llm.json)" >> $GITHUB_OUTPUT
        else
          echo "total_findings=0" >> $GITHUB_OUTPUT
          echo "issues_created=0" >> $GITHUB_OUTPUT
          echo "issues_updated=0" >> $GITHUB_OUTPUT
          echo "issues_closed=0" >> $GITHUB_OUTPUT
        fi

        echo "sarif_path=$OUTPUT_DIR/results.sarif" >> $GITHUB_OUTPUT
        echo "llm_json_path=$OUTPUT_DIR/results.llm.json" >> $GITHUB_OUTPUT

    - name: Check if Code Scanning is available
      if: inputs.mode != 'audit'
      id: check-code-scanning
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # Check if the repo has code scanning enabled by trying to list alerts
        # This avoids the noisy error from codeql-action when it's not available
        if gh api "/repos/${{ github.repository }}/code-scanning/alerts" --silent 2>/dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "Code scanning is available"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "Code scanning not available (private repo without Advanced Security, or not enabled)"
        fi

    - name: Upload SARIF to Code Scanning
      # Note: This step requires:
      # - security-events: write permission
      # - GitHub Advanced Security enabled (for private repos)
      # Skipped if code scanning is not available
      if: steps.check-code-scanning.outputs.available == 'true' && hashFiles('.vibecheck-output/results.sarif') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
      with:
        sarif_file: .vibecheck-output/results.sarif
        category: vibeCheck

    - name: Generate Summary
      if: inputs.mode != 'audit'
      shell: bash
      run: |
        OUTPUT_DIR="${{ github.workspace }}/.vibecheck-output"

        if [ -f "$OUTPUT_DIR/results.llm.json" ]; then
          echo "## 🛡️ vibeCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=$(jq '.summary.totalFindings // 0' $OUTPUT_DIR/results.llm.json)
          CREATED=$(jq '.summary.issuesCreated // 0' $OUTPUT_DIR/results.llm.json)
          UPDATED=$(jq '.summary.issuesUpdated // 0' $OUTPUT_DIR/results.llm.json)
          CLOSED=$(jq '.summary.issuesClosed // 0' $OUTPUT_DIR/results.llm.json)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Findings | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Issues Created | $CREATED |" >> $GITHUB_STEP_SUMMARY
          echo "| Issues Updated | $UPDATED |" >> $GITHUB_STEP_SUMMARY
          echo "| Issues Closed | $CLOSED |" >> $GITHUB_STEP_SUMMARY

          # Show tool execution stats if available
          TOOLS_TOTAL=$(jq '.summary.toolsRun.total // 0' $OUTPUT_DIR/results.llm.json)
          if [ "$TOOLS_TOTAL" -gt 0 ]; then
            TOOLS_SUCCESS=$(jq '.summary.toolsRun.successful // 0' $OUTPUT_DIR/results.llm.json)
            TOOLS_FAILED=$(jq '.summary.toolsRun.failed // 0' $OUTPUT_DIR/results.llm.json)
            TOOLS_SKIPPED=$(jq '.summary.toolsRun.skipped // 0' $OUTPUT_DIR/results.llm.json)
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Tool Execution" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Successful | $TOOLS_SUCCESS |" >> $GITHUB_STEP_SUMMARY
            
            if [ "$TOOLS_FAILED" -gt 0 ]; then
              echo "| ❌ Failed | $TOOLS_FAILED |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "$TOOLS_SKIPPED" -gt 0 ]; then
              echo "| ⊘ Skipped | $TOOLS_SKIPPED |" >> $GITHUB_STEP_SUMMARY
              
              # Show details of skipped tools
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>⚠️ <strong>Tools skipped</strong> (may need dependencies)</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Extract skipped tool details
              jq -r '.summary.toolsRun.details[] | select(.status == "skipped") | "- **\(.name)**: \(.skipReason // "dependency or config missing")"' $OUTPUT_DIR/results.llm.json >> $GITHUB_STEP_SUMMARY
              
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "💡 To enable these tools, ensure dependencies are installed successfully. For private packages, configure \`vibecheck_github_package_token\` in your workflow." >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Show suppressed findings if any exist (below severity/confidence threshold)
          SUPPRESSED_TOTAL=$(jq '.summary.suppressed.total // 0' $OUTPUT_DIR/results.llm.json)
          if [ "$SUPPRESSED_TOTAL" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>ℹ️ <strong>$SUPPRESSED_TOTAL findings suppressed</strong> (below threshold)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Suppressed |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------------|" >> $GITHUB_STEP_SUMMARY

            for sev in info low medium high critical; do
              COUNT=$(jq ".summary.suppressed.bySeverity.$sev // 0" $OUTPUT_DIR/results.llm.json)
              if [ "$COUNT" -gt 0 ]; then
                echo "| $sev | $COUNT |" >> $GITHUB_STEP_SUMMARY
              fi
            done

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Adjust \`severity_threshold\` or \`confidence_threshold\` to see these findings." >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Create Config PR
      if: inputs.mode != 'audit' && inputs.create_config_pr == 'true'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # This step requires additional permissions:
        #   contents: write   - to push the branch
        #   pull-requests: write - to create the PR
        # If these aren't available, the step will fail gracefully.
        
        # Check if there are new config files to commit
        CONFIG_FILES=""
        
        # Check for .trunk directory (created by trunk init)
        if [ -d ".trunk" ]; then
          if ! git ls-files --error-unmatch .trunk/trunk.yaml &>/dev/null; then
            CONFIG_FILES="$CONFIG_FILES .trunk/"
            echo "Found new .trunk/ directory"
          fi
        fi
        
        # Check for other common config files that might have been created
        for file in .dependency-cruiser.cjs .jscpd.json pyrightconfig.json mypy.ini; do
          if [ -f "$file" ] && ! git ls-files --error-unmatch "$file" &>/dev/null; then
            CONFIG_FILES="$CONFIG_FILES $file"
            echo "Found new config file: $file"
          fi
        done
        
        # Exit early if no new config files
        if [ -z "$CONFIG_FILES" ]; then
          echo "No new config files to commit"
          exit 0
        fi
        
        echo "New config files to commit:$CONFIG_FILES"
        
        # Check if PR already exists
        BRANCH_NAME="vibecheck/add-config-files"
        EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")
        
        if [ -n "$EXISTING_PR" ]; then
          echo "PR #$EXISTING_PR already exists for config files"
          exit 0
        fi
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create branch and commit
        git checkout -b "$BRANCH_NAME"
        git add $CONFIG_FILES
        git commit -m "chore: add vibeCheck config files"
        
        # Push branch
        git push origin "$BRANCH_NAME" --force
        
        # Create PR with simple body
        gh pr create \
          --title "chore: add vibeCheck config files" \
          --body "Adds configuration files generated by vibeCheck. These enable faster subsequent runs and can be customized." \
          --head "$BRANCH_NAME" \
          --base "${{ github.ref_name }}"

        echo "Created PR for config files"

    - name: Run Autofixes
      if: inputs.mode != 'audit' && inputs.autofix_prs == 'true'
      continue-on-error: true
      shell: bash
      run: |
        OUTPUT_DIR="${{ github.workspace }}/.vibecheck-output"

        # Check if results exist
        if [ ! -f "$OUTPUT_DIR/results.llm.json" ]; then
          echo "No results file found, skipping autofix"
          exit 0
        fi

        # Run the TypeScript autofix runner
        # This runs fix commands for all tools with safe autofix findings
        echo "Running autofix commands..."
        tsx ${{ github.action_path }}/src/tools/run-autofix.ts \
          --results "$OUTPUT_DIR/results.llm.json" \
          --root "${{ github.workspace }}" \
          --output "$OUTPUT_DIR/autofix-results.json"

    - name: Create Autofix PRs
      if: inputs.mode != 'audit' && inputs.autofix_prs == 'true'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        OUTPUT_DIR="${{ github.workspace }}/.vibecheck-output"
        AUTOFIX_RESULTS="$OUTPUT_DIR/autofix-results.json"

        # Check if autofix results exist
        if [ ! -f "$AUTOFIX_RESULTS" ]; then
          echo "No autofix results found, skipping PR creation"
          exit 0
        fi

        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Get short SHA for branch naming
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BASE_BRANCH="${{ github.ref_name }}"

        # Read tools that had successful fixes from autofix results
        # Each result has a "level" field: "safe" (auto-merge OK) or "requires_review" (draft PR)
        TOOLS=$(jq -r '.results[] | select(.success == true and (.files | length) > 0) | "\(.tool)|\(.level)"' "$AUTOFIX_RESULTS" 2>/dev/null)

        if [ -z "$TOOLS" ]; then
          echo "No tools with successful fixes, skipping PR creation"
          exit 0
        fi

        echo "Tools with fixes:"
        echo "$TOOLS" | while read -r line; do
          TOOL=$(echo "$line" | cut -d'|' -f1)
          LEVEL=$(echo "$line" | cut -d'|' -f2)
          echo "  - $TOOL ($LEVEL)"
        done

        # Create PR for each tool
        echo "$TOOLS" | while read -r line; do
          TOOL=$(echo "$line" | cut -d'|' -f1)
          LEVEL=$(echo "$line" | cut -d'|' -f2)

          echo ""
          echo "=== Creating PR for $TOOL ($LEVEL) ==="

          # Get files for this tool from autofix results
          FILES=$(jq -r ".results[] | select(.tool == \"$TOOL\" and .level == \"$LEVEL\") | .files[]" "$AUTOFIX_RESULTS" 2>/dev/null | tr '\n' ' ')

          if [ -z "$FILES" ] || [ "$FILES" = " " ]; then
            echo "No files for $TOOL, skipping"
            continue
          fi

          echo "Files: $FILES"

          # Use stable branch name with level suffix for requires_review
          if [ "$LEVEL" = "requires_review" ]; then
            BRANCH_NAME="vibecheck/autofix-$TOOL-review"
          else
            BRANCH_NAME="vibecheck/autofix-$TOOL"
          fi

          # Check if PR already exists for this tool (any open PR with this branch prefix)
          EXISTING_PR=$(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName == \"$BRANCH_NAME\") | .number" 2>/dev/null | head -1 || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $TOOL ($LEVEL) autofix, skipping"
            continue
          fi

          # Find related vibeCheck issue for this tool
          RELATED_ISSUE=$(gh issue list --label "tool:$TOOL" --label "vibeCheck" --state open --json number,title --jq '.[0] | "\(.number)|\(.title)"' 2>/dev/null || echo "")

          if [ -n "$RELATED_ISSUE" ]; then
            ISSUE_NUMBER=$(echo "$RELATED_ISSUE" | cut -d'|' -f1)
            ISSUE_TITLE=$(echo "$RELATED_ISSUE" | cut -d'|' -f2)
            PR_TITLE="fix: $ISSUE_TITLE"
            CLOSES_LINE="Closes #$ISSUE_NUMBER"
          else
            PR_TITLE="fix: auto-fix $TOOL issues"
            CLOSES_LINE=""
          fi

          # Create branch from base
          git checkout "$BASE_BRANCH"
          git checkout -b "$BRANCH_NAME"

          # Check if there are changes to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit for $TOOL"
            git checkout "$BASE_BRANCH"
            git branch -D "$BRANCH_NAME" 2>/dev/null || true
            continue
          fi

          # Add only the fixed files and commit
          git add $FILES 2>/dev/null || git add -A
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH_NAME" --force

          # Create PR - use --draft for requires_review fixes
          if [ "$LEVEL" = "requires_review" ]; then
            PR_BODY="## Summary
        Automated fixes for $TOOL issues detected by vibeCheck.

        ⚠️ **These fixes require manual review** before merging. The changes are generally safe but may affect code behavior.

        $CLOSES_LINE

        ---
        Generated by [vibeCheck](https://github.com/WolffM/vibecheck)"

            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH_NAME" --base "$BASE_BRANCH" --draft
            echo "Created DRAFT autofix PR for $TOOL (requires review)"
          else
            PR_BODY="## Summary
        Automated fixes for safe $TOOL issues detected by vibeCheck.

        These are formatting/style fixes that are safe to apply automatically.

        $CLOSES_LINE

        ---
        Generated by [vibeCheck](https://github.com/WolffM/vibecheck)"

            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH_NAME" --base "$BASE_BRANCH"
            echo "Created autofix PR for $TOOL"
          fi

          git checkout "$BASE_BRANCH"
        done

        echo ""
        echo "Autofix PR creation complete"
